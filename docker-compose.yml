version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pagepilot-postgres
    environment:
      POSTGRES_DB: pagepilot
      POSTGRES_USER: pagepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagepilot -d pagepilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pagepilot-network

  chroma:
    image: chromadb/chroma:latest
    container_name: pagepilot-chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pagepilot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pagepilot-backend
    environment:
      - DATABASE_URL=postgresql://pagepilot:${POSTGRES_PASSWORD}@postgres:5432/pagepilot
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DIM=384
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - pagepilot-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  chroma_data:

networks:
  pagepilot-network:
    driver: bridge