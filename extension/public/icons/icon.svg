<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0.2" y1="0.8" x2="0.8" y2="0.2">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="124" height="124" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Inner border accent -->
  <rect x="6" y="6" width="116" height="116" rx="20" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Outer glow ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Navigation arrow pointing up-right (compass/pilot theme) -->
  <g filter="url(#glow)">
    <!-- Arrow shaft -->
    <path d="M48 82 L76 56" stroke="url(#arrowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow head -->
    <path d="M58 54 L80 50 L76 72" stroke="url(#arrowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Second smaller arrow (movement/dynamic feel) -->
  <path d="M52 48 L62 38" stroke="url(#accentGradLight)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M54 40 L65 37 L62 47" stroke="url(#accentGradLight)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.6"/>

  <!-- AI Sparkle (top-right) -->
  <g filter="url(#glow)">
    <path d="M88 30 L90 36 L96 38 L90 40 L88 46 L86 40 L80 38 L86 36Z" fill="url(#accentGrad)"/>
    <path d="M88 34 L89 37 L92 38 L89 39 L88 42 L87 39 L84 38 L87 37Z" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Small dots accent -->
  <circle cx="40" cy="86" r="2.5" fill="url(#accentGrad)" opacity="0.4"/>
  <circle cx="82" cy="40" r="1.5" fill="url(#accentGradLight)" opacity="0.3"/>
</svg>
